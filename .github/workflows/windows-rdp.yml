name: Windows Cloud RDP

on:
  workflow_dispatch:

# حداقل permission لازم
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    # حداکثر زمان این Job
    timeout-minutes: 360

    steps:

      # --------------------------------------------------
      # 1. Enable RDP securely
      # --------------------------------------------------
      - name: Enable Remote Desktop
        shell: powershell
        run: |
          # Enable RDP
          Set-ItemProperty 
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' 
            -Name 'fDenyTSConnections' 
            -Value 0

          # KEEP NLA ENABLED
          Set-ItemProperty 
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' 
            -Name 'UserAuthentication' 
            -Value 1

          # Enable RDP service
          Set-Service -Name TermService -StartupType Automatic
          Start-Service TermService

      # --------------------------------------------------
      # 2. Create private RDP user
      # --------------------------------------------------
      - name: Create RDP User
        shell: powershell
        env:
          RDP_USERNAME: ${{ secrets.RDP_USERNAME }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_USERNAME)) {
            throw "RDP_USERNAME secret is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "RDP_PASSWORD secret is missing."
          }

          $Password = ConvertTo-SecureString 
            $env:RDP_PASSWORD 
            -AsPlainText 
            -Force

          # Create user
          New-LocalUser 
            -Name $env:RDP_USERNAME 
            -Password $Password 
            -PasswordNeverExpires:$false 
            -AccountNeverExpires 
            -UserMayNotChangePassword:$false 
            -ErrorAction Stop

          # Add to Remote Desktop Users
          Add-LocalGroupMember 
            -Group "Remote Desktop Users" 
            -Member $env:RDP_USERNAME 
            -ErrorAction Stop

          # Add administrator privileges only if you actually need them
          Add-LocalGroupMember 
            -Group "Administrators" 
            -Member $env:RDP_USERNAME 
            -ErrorAction Stop

      # --------------------------------------------------
      # 3. Install Tailscale
      # --------------------------------------------------
      - name: Install Tailscale
        shell: powershell
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest 
            -Uri $url 
            -OutFile $installer

          Start-Process 
            -FilePath "msiexec.exe" 
            -ArgumentList "/i "$installer" /quiet /norestart" 
            -Wait 
            -NoNewWindow

      # --------------------------------------------------
      # 4. Connect to Tailscale
      # --------------------------------------------------
      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_EPHEMERAL_AUTH_KEY: ${{ secrets.TAILSCALE_EPHEMERAL_AUTH_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_EPHEMERAL_AUTH_KEY)) {
            throw "TAILSCALE_EPHEMERAL_AUTH_KEY secret is missing."
          }

          & "C:\Program Files\Tailscale\tailscale.exe" up 
            --authkey="$env:TAILSCALE_EPHEMERAL_AUTH_KEY" 
            --hostname="github-rdp-$env:GITHUB_RUN_ID"

          Start-Sleep -Seconds 5

      # --------------------------------------------------
      # 5. Restrict RDP firewall to Tailscale
      # --------------------------------------------------
      - name: Restrict RDP To Tailscale
        shell: powershell
        run: |
          # Disable the broad built-in RDP firewall rules
          Disable-NetFirewallRule 
            -DisplayGroup "Remote Desktop"# Allow RDP only from Tailscale's CGNAT range
          New-NetFirewallRule 
            -DisplayName "RDP - Tailscale Only" 
            -Direction Inbound 
            -Protocol TCP 
            -LocalPort 3389 
            -Action Allow 
            -RemoteAddress "100.64.0.0/10" `
            -Profile Any

      # --------------------------------------------------
      # 6. Get Tailscale IP
      # --------------------------------------------------
      - name: Show Connection Information
        shell: powershell
        run: |
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "       WINDOWS RDP IS READY"
          Write-Host "=============================================="
          Write-Host "Tailscale IP:"
          Write-Host $ts_ip
          Write-Host ""
          Write-Host "Username:"
          Write-Host $env:RDP_USERNAME
          Write-Host ""
          Write-Host "Password: stored in GitHub Secret"
          Write-Host "=============================================="
        env:
          RDP_USERNAME: ${{ secrets.RDP_USERNAME }}

      # --------------------------------------------------
      # 7. Keep runner alive
      # --------------------------------------------------
      - name: Keep Server Alive
        shell: powershell
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] RDP server running..."
          }
